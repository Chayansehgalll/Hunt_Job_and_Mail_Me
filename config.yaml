filters:
  include_titles:
    - "engineer"
    - "developer"
    - "software"
    - 'full[\s-]?stack'
    - "frontend"
    - "front-end"
    - "backend"
    - "back-end"
    - "web"
    - "product engineer"
    - "application engineer"
    - "application developer"
    - "member of technical staff"
    - '\bsde\b'
    - "software development engineer"
    - "software engineer"
    - "software developer"
    - 'full[\s-]?stack engineer'
    - 'full[\s-]?stack developer'
    - "frontend engineer"
    - "frontend developer"
    - "front-end engineer"
    - "front-end developer"
    - "backend engineer"
    - "backend developer"
    - "back-end engineer"
    - "back-end developer"
    - "web engineer"
    - "web developer"
    - "ui engineer"
    - "ui developer"
    - "javascript"
    - "typescript"
    - "react"
    - "next"
    - 'next\.?js'
    - "node"
    - 'node\.?js'
    - "ai engineer"
    - "applied ai"
    - "agent engineer"
    - "generative ai"
    - "llm"
    - "genai"

  exclude_titles:
    - '\bstaff\b'
    - '\bsenior\b'
    - '\blead\b'
    - '\bprincipal\b'
    - '\bdistinguished\b'
    - '\bfellow\b'
    - '\barchitect\b'
    - '\bdirector\b'
    - '\bvp\b'
    - '\bvice president\b'
    - '\bhead of\b'
    - '\bchief\b'
    - '\bcto\b'
    - '\bmanager\b'
    - '\bmanagement\b'
    - '\bintern\b'
    - '\binternship\b'
    - '\bapprentice\b'
    - '\btrainee\b'
    - '\bsales\b'
    - '\baccount executive\b'
    - '\bmarketing\b'
    - '\brecruit\b'
    - '\bsupport\b'
    - '\bsuccess\b'
    - '\bios\b'
    - '\bandroid\b'
    - '\bmobile\b'
    - '\bgame\b'
    - '\bembedded\b'
    - '\bfirmware\b'
    - '\bkernel\b'
    - '\bdriver\b'
    - '\bdata scientist\b'
    - '\bmachine learning scientist\b'
    - '\bresearch scientist\b'
    - '\bdevops\b'
    - '\bsre\b'
    - '\bsite reliability\b'
    - '\bnetwork(ing)?\b'
    - '\bdataplane\b'
    - '\bdata plane\b'
    - '\bpacket\b'
    - '\bc\+\+\b'
    - '\bqa\b'
    - '\bquality assurance\b'
    - '\btest engineer\b'
    - '\bsdet\b'

  locations:
    include:
      - india
      - bangalore
      - bengaluru
      - hyderabad
      - mumbai
      - pune
      - delhi
      - gurugram
      - gurgaon
      - noida
      - chennai
      - remote
      - anywhere
      - global
      - worldwide
      - apac
      - asia

    remote_scope_confirm_phrases:
      - "remote.{0,40}(india|apac|anywhere|global|worldwide|asia)"
      - "(india|apac|anywhere|global|worldwide|asia).{0,40}remote"
      - "work from any location"
      - "no location restriction"
      - "open to candidates in india"
      - "hiring in india"

    remote_scope_reject_phrases:
      - 'remote.{0,40}(us only|u\.s\. only|usa only|united states only)'
      - "remote.{0,40}(canada only)"
      - "remote.{0,40}(uk only|eu only|europe only)"
      - "must be authorized to work in the (us|united states|uk|eu|europe|canada)"
      - "only considering candidates based in the (us|united states|uk|eu|europe|canada)"
      - "not hiring in india"
      - "no visa sponsorship"

  allow_remote: true
  max_age_days: 60

screen_batch_size: 10
screen_jd_chars: 2600
draft_jd_chars: 7000
score_threshold: 5.5
max_per_digest: 10

companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
